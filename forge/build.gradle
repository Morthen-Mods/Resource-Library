plugins {
    id 'ml-loader'
    id 'net.minecraftforge.gradle' version '[6.0.25, 6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

sourceSets {
    testmod {
        runtimeClasspath += main.runtimeClasspath;
        compileClasspath += main.compileClasspath;
        resources { srcDir 'src/testmod/generated' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
    testmodImplementation sourceSets.main.output
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    reobf = false

    runs {
        client {
            workingDirectory project.file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.testmod"
            taskName 'TestClient'
            mods {
                modClientRun {
                    source sourceSets.testmod
                }
            }
        }
        data {
            workingDirectory project.file('runs/data')
            ideaModule "${rootProject.name}.${project.name}.testmod"
            taskName("Dategen")
            args '--mod', 'resourcelibrary_test', '--all', '--output', file('src/testmod/generated/'), '--existing', file('src/testmod/resources/')
        }
    }
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

processResources {
    exclude 'resourcelibrary.mixin.json'
    exclude 'resourcelibrary.forge.mixin.json'
}

// Loader Specific Settings
publishMods {
    file = jar.archiveFile
    modLoaders.addAll("forge")
}