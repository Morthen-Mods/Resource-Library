plugins {
    id 'ml-loader'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

sourceSets {
    testmod {
        runtimeClasspath += main.runtimeClasspath;
        compileClasspath += main.compileClasspath;
        resources { srcDir 'src/testmod/generated' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    testmodImplementation sourceSets.main.output;

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}+${minecraft_version}"
}

loom {
    var aw = project(":common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) accessWidenerPath.set(aw)

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    runs {
        client {
            client()
            source sourceSets.testmod
            setConfigName("Fabric Test Client")
            ideConfigGenerated(true)
            programArgs('--username', 'Dev')
            runDir("runs/client")
        }

        server {
            server()
            source sourceSets.testmod
            setConfigName("Fabric Test Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }

        datagen {
            inherit server
            source sourceSets.testmod
            name "Fabric Test Datagen"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/testmod/generated")}"
            vmArg "-Dfabric-api.datagen.modid=resourcelibrary_test"

            runDir "build/datagen"
        }
    }
}

// Loader Specific Settings
publishMods {
    file = remapJar.archiveFile
    modLoaders.addAll("fabric", "quilt")
    modrinth {
        requires('fabric-api')
    }
    curseforge {
        requires('fabric-api')
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom.withXml {
                asNode().dependencies.each { node ->
                    node.replaceNode {}
                }
            }
        }
    }
}