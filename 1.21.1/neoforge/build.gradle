plugins {
    id 'ml-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

dependencies {
    testmodImplementation sourceSets.main.output

    testmodImplementation(project(':1.21.1:common').sourceSets.testmod.output)
    runtimeOnly("maven.modrinth:crafttweaker:21.0.27-neoforge")

    runtimeOnly('com.blamejared.crafttweaker:CraftTweaker-neoforge-1.21.1:21.0.27')
}

neoForge {
    version = neoforge_21_1

    def at = file('../common/src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) accessTransformers = [at]

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_21_1
    }

    runs {
        configureEach {
            systemProperty('neoforge.enableGameTestNamespaces', mod_id)
            ideName = "NeoForge Test ${it.name.capitalize()} (${project.path})"
        }

        testClient {
            client()
            sourceSet = sourceSets.testmod
            gameDirectory = project.file("../common/runs/client")
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        "${mod_id}_test" { sourceSet sourceSets.testmod }
    }

}

compileTestmodJava {
    source(project(':1.21.1:common').sourceSets.testmod.allSource)
}

processTestmodResources {
    from file('../common/src/testmod/resources')
}

publishMods {
    file = jar.archiveFile
    modLoaders.addAll("neoforge")

    modrinth {
        minecraftVersions.addAll("1.21", "1.21.1")
    }
    curseforge {
        minecraftVersions.addAll("1.21", "1.21.1")
    }
}