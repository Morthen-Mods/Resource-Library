plugins {
    id 'ml-loader'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    testmodImplementation project(':1.21.5:common').sourceSets.testmod.output

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_21_5}"
    modApi "net.fabricmc.fabric-api:fabric-api:${fabric_21_5}+${minecraft_version}"
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }

    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) accessWidenerPath.set(aw)

/*    runs {
        client {
            client()
            source sourceSets.testmod
            setConfigName("Fabric Test Client")
            ideConfigGenerated(true)
            programArgs('--username', 'Dev')
            runDir("runs/client")
        }
    }*/
}

processTestmodResources {
    from file('../common/src/testmod/resources')
}

publishMods {
    file = remapJar.archiveFile
    modLoaders.addAll("fabric", "quilt")

    modrinth {
        requires('fabric-api')
        minecraftVersions.add("1.21.5")
    }
    curseforge {
        requires('fabric-api')
        minecraftVersions.add("1.21.5")
    }
}
